[build]
builder = "NIXPACKS"

[deploy]
startCommand = "echo STAGE_START && pwd && ls && echo STAGE_ALEMBIC && alembic upgrade head && echo STAGE_SEED && python -u -m scripts.seed_questions; echo SEED_EXIT=$? && echo STAGE_BOT && exec python -u -m pylevelup"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
