services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pylevelup
      POSTGRES_PASSWORD: pylevelup
      POSTGRES_DB: pylevelup
    ports:
      - "5432:5432"
    volumes:
      - pylevelup_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pylevelup -d pylevelup"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - pylevelup_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: pylevelup
      RABBITMQ_DEFAULT_PASS: pylevelup
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - pylevelup_rabbit:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  bot:
    build: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "pylevelup"]
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "pylevelup.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    restart: unless-stopped

  beat:
    build: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "pylevelup.celery_app.celery_app", "beat", "--loglevel=INFO"]
    restart: unless-stopped

volumes:
  pylevelup_pg:
  pylevelup_redis:
  pylevelup_rabbit:
