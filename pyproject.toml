[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylevelup"
version = "0.1.0"
description = "PyLevelUp Telegram bot for Python interview preparation with spaced repetition"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Andrey Muratov" }]
dependencies = [
    "aiogram==3.13.1",
    "SQLAlchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",
    "redis==5.2.1",
    "celery==5.4.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "orjson==3.10.11",
    "structlog==24.4.0",
    "tzdata==2024.2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.7.4",
    "mypy==1.13.0",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
]

[project.scripts]
pylevelup-bot = "pylevelup.__main__:main"
pylevelup-seed = "scripts.seed_questions:main"

[tool.setuptools.packages.find]
include = ["pylevelup*", "scripts*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
