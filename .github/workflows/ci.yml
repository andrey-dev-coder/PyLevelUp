name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.4"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check pylevelup scripts migrations
      - name: Verify no em-dashes in tracked files
        run: |
          set -e
          if git ls-files -z | xargs -0 grep -lP '[\x{2014}\x{2013}\x{2212}]' 2>/dev/null; then
            echo "Em-dash detected in tracked files" && exit 1
          fi

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pylevelup
          POSTGRES_PASSWORD: pylevelup
          POSTGRES_DB: pylevelup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pylevelup -d pylevelup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOT_TOKEN: dummy
      DATABASE_URL: postgresql+asyncpg://pylevelup:pylevelup@localhost:5432/pylevelup
      DATABASE_URL_SYNC: postgresql+psycopg2://pylevelup:pylevelup@localhost:5432/pylevelup
      REDIS_URL: redis://localhost:6379/0
      REDIS_FSM_URL: redis://localhost:6379/1
      REDIS_CACHE_URL: redis://localhost:6379/2
      CELERY_BROKER_URL: redis://localhost:6379/3
      CELERY_RESULT_BACKEND: redis://localhost:6379/4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.4"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Alembic upgrade head
        run: alembic upgrade head
      - name: Seed questions
        run: python -m scripts.seed_questions
